# Alembic Configuration File
# Alembic migration tool for SQLAlchemy

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be named with an ordering prefix like 001_
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to zoneinfo.ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field that's auto-generated by the generate_revision command
# and by the autoincrement start parameter for Alembic directives
# such as create_table and alter_column.  The default value is
# "autogenerated" which will apply the first several characters of the
# revision message up to the first period
# max_length = 40

# The output file encoding used when revision files
# are written from script.py.mako.tpl.  The encoding of the
# target file is taken from the $SQLALCHEMY_URL environment
# variable.  'utf-8' is the default for `iocompat.py`'s
# encoding parameter.
# output_encoding = utf-8

sqlalchemy.url = driver://user:password@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
